name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # 没配置签名 Secrets 时只跑单元测试，不报错；APK 由维护者手动上传到 Release
      HAS_SIGNING: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept licenses and install SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-33" "build-tools;33.0.2" "platform-tools" > /dev/null

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Decode release keystore
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore

      - name: Write keystore.properties
        if: env.HAS_SIGNING == 'true'
        env:
          KS_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KS_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_STORE_PASSWORD" ] || [ -z "$KS_KEY_ALIAS" ] || [ -z "$KS_KEY_PASSWORD" ]; then
            echo "::error::Secrets RELEASE_STORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD are not set"
            exit 1
          fi
          printf 'storeFile=app/release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KS_STORE_PASSWORD" "$KS_KEY_ALIAS" "$KS_KEY_PASSWORD" > keystore.properties

      - name: Build release APK
        if: env.HAS_SIGNING == 'true'
        run: ./gradlew assembleRelease --no-daemon

      - name: Cleanup signing material
        if: always() && env.HAS_SIGNING == 'true'
        run: |
          rm -f app/release.keystore keystore.properties

      - name: Upload APK
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Rename APK for release
        if: env.HAS_SIGNING == 'true' && startsWith(github.ref, 'refs/tags/v')
        run: cp app/build/outputs/apk/release/app-release.apk "tangli-${GITHUB_REF_NAME}.apk"

      - name: Attach APK to release
        if: env.HAS_SIGNING == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # 发布说明在 GitHub Release 页面手写（或已存在），这里只上传 APK
          files: tangli-${{ github.ref_name }}.apk
